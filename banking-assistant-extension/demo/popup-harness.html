<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Popup Harness</title>
    <link rel="stylesheet" href="../src/popup/popup.css" />
    <style>
      body { width: auto; max-width: 900px; margin: 0 auto; padding: 16px; background: #eef1f4; }
      .harness-bar {
        background: #fff; border: 1px solid #e4e7ec; border-radius: 10px;
        padding: 12px 14px; margin-bottom: 14px; font-size: 12px; color: #667085;
      }
      .harness-bar h1 { font-size: 14px; margin: 0 0 6px; color: #0b5d3b; }
      .harness-bar button { font-size: 12px; padding: 5px 10px; margin-right: 6px; }
      .panes { display: grid; grid-template-columns: 380px 1fr; gap: 14px; align-items: start; }
      #popup-root { background: #fff; border: 1px solid #e4e7ec; border-radius: 10px; padding: 12px; }
      #log { background: #0b1021; color: #b7e4c7; padding: 12px; border-radius: 10px;
             font-size: 11px; max-height: 70vh; overflow: auto; white-space: pre-wrap; }
      @media (max-width: 800px) { .panes { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="harness-bar">
      <h1>Popup Harness — 離線驗證轉帳清單 UI</h1>
      <div>
        用假的 <code>chrome.*</code> API 驅動真正的 popup，不需要安裝 extension，也不會連到銀行。
        「開始批次」只會把送出的內容印到右側記錄，<strong>不會真的轉帳</strong>。
      </div>
      <div style="margin-top:8px;">
        <button id="seedLegacy">重設：舊版 4 筆草稿（驗證遷移）</button>
        <button id="seedEmpty">重設：全新安裝</button>
        <button id="dumpState">印出 storage</button>
      </div>
    </div>

    <div class="panes">
      <div id="popup-root">載入 popup 中…</div>
      <pre id="log">（記錄）</pre>
    </div>

    <script type="module" src="popup-harness.js"></script>
  </body>
</html>
